<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DOLONG - Tool Mã Hoá</title>
<style>
:root{
  --bg:#0d0d0d;--panel:#1a1a1a;--panel-2:#252525;
  --txt:#ececec;--dim:#8e8e8e;--line:#333;
  --accent:#10a37f;--accent-hover:#1a7f64;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100vh}
body{
  font-family:var(--font);color:var(--txt);background:var(--bg);
  font-size:15px;line-height:1.6;
  display:flex;flex-direction:column;position:relative;
  align-items:center;padding:20px;
}

/* HEADER */
.header{
  width:100%;max-width:600px;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;margin-bottom:16px;
}
.logo-area{display:flex;align-items:center;gap:12px}
.logo-img{width:36px;height:36px;border-radius:8px;object-fit:cover;}
.brand-text h1{font-size:16px;font-weight:600;color:#fff;letter-spacing:0.5px}
.brand-text .version{font-size:11px;color:var(--dim);margin-top:-2px}

/* CARD */
.card{
  width:100%;max-width:600px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:20px;
  box-shadow:0 4px 20px rgba(0,0,0,0.2);
  margin-bottom:16px;
}
.card-title{font-size:14px;font-weight:600;color:#fff;margin-bottom:12px;}

/* INPUTS */
.input-group{margin-bottom:16px;}
.input-label{font-size:12px;color:var(--dim);margin-bottom:6px;display:block;}
select.text-input{
  width:100%;padding:12px 14px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:10px;color:var(--txt);
  font-family:var(--font);font-size:14px;outline:none;
  appearance:none;
  background-image:url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238e8e8e%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
  background-repeat:no-repeat;
  background-position:right 14px top 50%;
  background-size:12px auto;
}
select.text-input:focus{border-color:var(--accent);}
textarea.text-input{
  width:100%;padding:12px 14px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:10px;color:var(--txt);
  font-family:var(--font);font-size:14px;outline:none;
  resize:vertical;min-height:120px;
}
textarea.text-input:focus{border-color:var(--accent);}
textarea.text-input::placeholder{color:var(--dim);}

/* BUTTONS */
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.action-btn{
  width:100%;padding:12px;background:var(--accent);border:0;
  border-radius:10px;color:#fff;font-family:var(--font);
  font-size:14px;font-weight:600;cursor:pointer;transition:background .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.action-btn:hover{background:var(--accent-hover);}
.action-btn.secondary{background:var(--panel-2);color:var(--txt);border:1px solid var(--line);}
.action-btn.secondary:hover{background:var(--line);}

/* FILE UPLOAD */
.file-upload-wrapper{
  position:relative;margin-bottom:12px;
}
.file-upload-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:12px;background:rgba(16,163,127,0.1);
  border:1px dashed var(--accent);border-radius:10px;
  color:var(--accent);font-size:13px;font-weight:600;
  cursor:pointer;transition:background .2s;
}
.file-upload-btn:hover{background:rgba(16,163,127,0.2);}
input[type=file]{display:none;}

/* RESULT */
.result-box{
  background:var(--panel-2);border:1px solid var(--line);
  border-radius:10px;padding:12px;margin-top:16px;
  font-size:13px;word-break:break-all;display:none;
}
.result-box.show{display:block;}
.result-box code{
  font-family:monospace;color:var(--accent);
  background:rgba(16,163,127,0.1);padding:4px;border-radius:4px;
  display:block;margin-top:8px;
}

/* FOOTER */
.footer{text-align:center;font-size:11px;color:var(--dim);margin-top:20px;}

/* LOADING SCREEN */
.loading-screen{
  position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .3s;
}
.loading-screen.hide{opacity:0;pointer-events:none}
.loader-logo{font-size:40px;color:var(--accent);}
.loader-bar{width:200px;height:2px;background:var(--line);border-radius:10px;overflow:hidden;}
.loader-bar-fill{height:100%;width:0%;background:var(--accent);transition:width .1s;}
.loader-text{font-size:12px;color:var(--dim);}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loader-logo">🔐</div>
  <div class="loader-bar"><div class="loader-bar-fill" id="loaderFill"></div></div>
  <div class="loader-text">Đang khởi tạo...</div>
</div>

<div class="header">
  <div class="logo-area">
    <img class="logo-img" src="https://cdn.phototourl.com/member/2026-10-24-fee5b4e7-c8bd-4156-9ea3-6203e0913351.jpg" alt="Logo">
    <div class="brand-text">
      <h1>MÃ HOÁ / GIẢI MÃ</h1>
      <div class="version">DOLONG TOOL</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="input-group">
    <label class="input-label">Chọn kiểu mã hoá</label>
    <select id="encodeType" class="text-input">
      <option value="base64">Base64</option>
      <option value="hex">Hex</option>
      <option value="url">URL Encode</option>
      <option value="binary">Binary</option>
    </select>
  </div>

  <div class="input-group">
    <label class="input-label">Nhập nội dung (hoặc Upload file)</label>
    
    <div class="file-upload-wrapper">
      <input type="file" id="fileInput" onchange="handleFileUpload()">
      <div class="file-upload-btn" onclick="document.getElementById('fileInput').click()">
        📁 Upload File (Text, Ảnh, Nhạc, Video)
      </div>
    </div>

    <textarea id="mainInput" class="text-input" placeholder="Nhập text vào đây hoặc upload file..."></textarea>
  </div>

  <div class="btn-row">
    <button class="action-btn" onclick="encodeText()">🔒 Mã Hoá</button>
    <button class="action-btn secondary" onclick="decodeText()">🔓 Giải Mã</button>
  </div>

  <div class="result-box" id="resultBox"></div>
</div>

<div class="footer">DOLONG TOOL • TELEGRAM:@dolong07</div>

<script>
/* ====================================================================
   KHỞI TẠO
   ==================================================================== */
window.addEventListener('DOMContentLoaded', () => {
  let progress = 0;
  const interval = setInterval(() => {
    progress += Math.random() * 25;
    if (progress >= 100) {
      progress = 100;
      clearInterval(interval);
      setTimeout(() => document.getElementById('loadingScreen').classList.add('hide'), 300);
    }
    document.getElementById('loaderFill').style.width = progress + '%';
  }, 100);
});

/* ====================================================================
   UPLOAD FILE (Đọc dữ liệu file thành Base64 hoặc Text)
   ==================================================================== */
function handleFileUpload() {
  const file = document.getElementById('fileInput').files[0];
  if (!file) return;

  const textarea = document.getElementById('mainInput');
  
  // Nếu là ảnh/video/nhạc, đọc thành base64 (Data URL)
  if (file.type.startsWith('image/') || file.type.startsWith('video/') || file.type.startsWith('audio/') || file.type === 'application/pdf') {
    const reader = new FileReader();
    reader.onload = function(e) {
      textarea.value = e.target.result; // Data URL (data:image/png;base64,...)
      alert('Đã tải file! Bấm "Mã Hoá" để lấy chuỗi Base64, hoặc "Giải Mã" để tạo lại file.');
    };
    reader.readAsDataURL(file);
  } else {
    // Nếu là file text (txt, html, css, js...), đọc thẳng thành text
    const reader = new FileReader();
    reader.onload = function(e) {
      textarea.value = e.target.result;
      alert('Đã tải file text thành công!');
    };
    reader.readAsText(file);
  }
}

/* ====================================================================
   MÃ HOÁ & GIẢI MÃ (Hỗ trợ File/Data URL)
   ==================================================================== */
async function encodeText() {
  const text = document.getElementById('mainInput').value;
  const type = document.getElementById('encodeType').value;
  const resultBox = document.getElementById('resultBox');
  
  if (!text) { alert('Nhập nội dung hoặc upload file đi Long Đẹp Trai!'); return; }
  
  try {
    let result = '';
    if (type === 'base64') {
      // Nếu là Data URL (file), lấy phần base64 thôi
      if (text.startsWith('data:')) {
        result = text.split(',')[1];
      } else {
        result = btoa(unescape(encodeURIComponent(text)));
      }
    } else if (type === 'hex') {
      result = Array.from(text).map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
    } else if (type === 'url') {
      result = encodeURIComponent(text);
    } else if (type === 'binary') {
      result = Array.from(text).map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join(' ');
    }
    
    resultBox.innerHTML = `✅ <b>Kết quả mã hoá (${type}):</b><code>${result}</code>`;
    resultBox.classList.add('show');
  } catch (err) {
    resultBox.innerHTML = `❌ Lỗi: ${err.message}`;
    resultBox.classList.add('show');
  }
}

async function decodeText() {
  let text = document.getElementById('mainInput').value.trim();
  const type = document.getElementById('encodeType').value;
  const resultBox = document.getElementById('resultBox');
  
  if (!text) { alert('Nhập nội dung cần giải mã đi!'); return; }
  
  try {
    let result = '';
    if (type === 'base64') {
      // Nếu giải mã ra file, gắn Data URL vào
      // Đoán xem là file gì (ảnh, pdf, hay text)
      try {
        result = decodeURIComponent(escape(atob(text)));
        // Nếu là text bình thường thì in ra
        resultBox.innerHTML = `✅ <b>Kết quả giải mã:</b><code>${result}</code>`;
      } catch(e) {
        // Nếu không phải text, trả về link download
        const link = document.createElement('a');
        link.href = 'data:application/octet-stream;base64,' + text;
        link.download = 'decoded_file';
        resultBox.innerHTML = `✅ <b>File đã giải mã!</b><br><a href="${link.href}" download="${link.download}" style="color:var(--accent);">Bấm vào đây để tải xuống file</a>`;
      }
    } else if (type === 'hex') {
      const hex = text.replace(/\s+/g, '');
      result = hex.match(/.{1,2}/g).map(byte => String.fromCharCode(parseInt(byte, 16))).join('');
      resultBox.innerHTML = `✅ <b>Kết quả giải mã:</b><code>${result}</code>`;
    } else if (type === 'url') {
      result = decodeURIComponent(text);
      resultBox.innerHTML = `✅ <b>Kết quả giải mã:</b><code>${result}</code>`;
    } else if (type === 'binary') {
      const binary = text.replace(/\s+/g, '');
      result = binary.match(/.{1,8}/g).map(byte => String.fromCharCode(parseInt(byte, 2))).join('');
      resultBox.innerHTML = `✅ <b>Kết quả giải mã:</b><code>${result}</code>`;
    }
    
    resultBox.classList.add('show');
  } catch (err) {
    resultBox.innerHTML = `❌ Lỗi: ${err.message}<br><small>Chuỗi không đúng định dạng ${type}!</small>`;
    resultBox.classList.add('show');
  }
}
</script>
</body>
</html>
